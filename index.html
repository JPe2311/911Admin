<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>911 - Admin Gestión General</title>
  <script src="src/firebase-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // Check auth before loading app
    async function init() {
      const userEmail = sessionStorage.getItem('userEmail');
      if (!userEmail) {
        window.location.href = 'login.html';
        return;
      }
      
      // Dynamically load the app
      const script = document.createElement('script');
      script.src = 'src/capacitaciones_app.js';
      script.onload = () => {
        if (window.initApp) window.initApp();
      };
      document.body.appendChild(script);
    }
    
    init();
  </script>
</body>
</html>
